  qi = i; answered = ans;
  const c = order[i], w = c[L];
  $("#dots").innerHTML = order.map((_, k) => `<span class="${k < i || (k === i && ans) ? "done" : ""}"></span>`).join("");
  $("#card").className = "card notepad pop";
  if (!ans) {
    $("#card").innerHTML = `<span class="tag">${t(S.doubts.includes(c.doubt) ? "your" : "mof")}</span><div class="q">${w.q}</div>`;
    $("#quiz-actions").innerHTML = `<div class="row"><button class="btn ghost" data-a="myth">${t("myth")}</button><button class="btn primary" data-a="fact">${t("fact")}</button></div>`;
    $("#quiz-actions").onclick = (e) => {
      const b = e.target.closest("[data-a]"); if (!b) return;
      const right = b.dataset.a === c.truth; S.answers.push({ doubt: c.doubt, right }); buzz(right ? 10 : [10, 40, 10]);
      track("answer", { doubt: c.doubt, right });
      renderCard(i, { right });
    };
    return;
  }
  $("#card").innerHTML = `<span class="tag">${t(c.truth)}</span><br>
    <div class="verdict">${t(c.truth)}.${SQUIGGLE}${ans.right ? `<small>${t("got")}</small>` : ""}</div>
    <div class="ans">${w.a}</div><div class="india">${w.india}</div>
    <a class="stamp" target="_blank" rel="noopener" href="${c.url}">✓ ${t("src")} ${c.src}</a>`;
  $("#quiz-actions").innerHTML = `<button class="btn primary" id="next-card">${t(i < order.length - 1 ? "next" : "almost")}</button>`;
  $("#quiz-actions").onclick = null;
  $("#next-card").onclick = () => i < order.length - 1 ? renderCard(i + 1, null) : show("me");
}

// 4: Indian BMI cut-offs (screening, never a diagnosis)
function bandIndex(b) { return b < 18.5 ? 0 : b < 23 ? 1 : b < 25 ? 2 : 3; }
function showBmi() {
  const [band, tip] = BANDS[L][S.bmi.i];
  S.bmi.band = BANDS.en[S.bmi.i][0];
  let waistNote = "";
  if (S.bmi.waist && S.bmi.sex) {
    const cut = S.bmi.sex === "m" ? 90 : 80;
    waistNote = S.bmi.waist >= cut ? t("waist_over", { w: S.bmi.waist, who: t(S.bmi.sex === "m" ? "men" : "women"), c: cut }) : t("waist_ok");
  }
  $("#bmi-out").hidden = false;
  const pct = Math.max(0, Math.min(100, (S.bmi.value - 15) / (35 - 15) * 100));
  requestAnimationFrame(() => { $("#needle").style.left = `calc(${pct}% - 2px)`; });
  $("#bmi-text").innerHTML = `BMI <b>${S.bmi.value}</b>: ${band}.${waistNote} ${tip}`;
  $("#me-go").textContent = t("see");
}
$("#me-go").addEventListener("click", () => {
  if (S.bmi) { startWrap(); return; }
  const h = parseFloat($("#h").value) / 100, w = parseFloat($("#w").value);
  if (!(h > 1.2 && h < 2.2 && w > 30 && w < 250)) { $("#h").focus(); return; }
  const value = Math.round(w / (h * h) * 10) / 10;
  S.bmi = { value, i: bandIndex(value), waist: parseFloat($("#waist").value) || null, sex: $("#sex").value };
  showBmi(); track("bmi", { band: S.bmi.band });
});
$("#me-skip").addEventListener("click", () => { track("bmi_skip"); startWrap(); });

// 5: Wrapped-style readout
let slides = [], si = 0, timer = null;
function buildSlides() {
  const score = S.answers.filter((a) => a.right).length, n = S.answers.length;
  const focus = (S.doubts.length ? S.doubts : ["regain", "muscle"]).slice(0, 2);
  slides = [
    `<span class="note">${t("score")}</span><div class="big">${score}/${n}</div><p class="lead">${t(score >= 4 ? "good" : "fine_score")}</p>`,
    `<span class="note">${t("matters")}</span>${focus.map((d) => `<p class="lead" style="font-size:19px;color:var(--cream)">${MATTERS[d][L]}</p>`).join("")}`,
    S.bmi ? `<span class="note">${t("nums")}</span><div class="big" style="font-size:72px">${S.bmi.value}</div><p class="lead">BMI: ${BANDS[L][S.bmi.i][0]}.</p>`
          : `<span class="note">${t("more")}</span><h2>${t("never")}</h2><p class="lead">${t("body")}</p>`,
    `<div class="share-card notepad"><span class="tag">${t("tried")}</span><h2>${t("share_h")}</h2><p style="margin:8px 0 0">${t("share_p", { s: score, n })}</p><p class="small" style="margin-top:12px">steer · steerclub.com</p></div>`,
  ];
}
function startWrap() { buildSlides(); si = 0; show("wrap"); renderSlide(); }
function renderSlide() {
  $("#story").innerHTML = slides.map((_, k) => `<span class="${k < si ? "done" : k === si ? "now" : ""}"><b></b></span>`).join("");
  $("#wrap-body").innerHTML = `<div class="pop">${slides[si]}</div>`;
  clearTimeout(timer); timer = setTimeout(nextSlide, 5500);
}
function nextSlide() { if (si < slides.length - 1) { si++; renderSlide(); } else { clearTimeout(timer); handoff(); } }
$("#wrap-tap").addEventListener("click", () => { buzz(6); nextSlide(); });

// 6: handoff, a warm lead instead of a cold one, and questions the person takes with them
function questions() {
  const picked = S.doubts.length ? S.doubts : ["regain", "muscle", "safety"];
  const extra = ["safety", "muscle", "regain", "me", "diabetes"].filter((d) => !picked.includes(d));
  return [...picked, ...extra].slice(0, 3).map((d) => QUESTIONS[d][L]);
}
function handoff() {
  const asked = S.doubts.map((d) => DOUBTS[d][L].replace(/[?？]/g, "").toLowerCase());
  $("#next-text").textContent = asked.length ? t("next_with", { list: asked.join("; ") }) : t("next_none");
  $("#qs-list").innerHTML = questions().map((q) => `<li>${q}</li>`).join("");
  const lead = { source: "playable_quiz", lang: L, hook_guess: S.guess, doubts: S.doubts,
                 myths_missed: S.answers.filter((a) => !a.right).map((a) => a.doubt),
                 bmi_band: S.bmi ? S.bmi.band : null, seconds_engaged: Math.round((Date.now() - S.started) / 1000) };
  const q = new URLSearchParams({ utm_source: params.get("utm_source") || "meta", utm_medium: "playable", utm_campaign: "willpower_or_biology", doubts: S.doubts.join(","), lang: L });
  $("#cta").href = "https://steerclub.com/?" + q.toString();
  $("#cta").onclick = () => track("cta_tap", lead);
  $("#lead-json").textContent = JSON.stringify(lead, null, 2);
  $("#lead-view").hidden = !params.has("team");
  if (current !== "next") show("next");
}
const qsText = () => t("qs_text") + "\n" + questions().map((q, i) => `${i + 1}. ${q}`).join("\n") + "\n\nsteerclub.com";
$("#qs-wa").addEventListener("click", () => { track("questions_whatsapp"); window.open("https://wa.me/?text=" + encodeURIComponent(qsText()), "_blank", "noopener"); });
$("#qs-copy").addEventListener("click", async () => {
  track("questions_copy");
  try { await navigator.clipboard.writeText(qsText()); } catch (e) {
    const ta = document.createElement("textarea"); ta.value = qsText(); document.body.appendChild(ta); ta.select();
    try { document.execCommand("copy"); } catch (e2) {} ta.remove();
  }
  $("#qs-copy").textContent = t("copied"); setTimeout(() => { $("#qs-copy").textContent = t("qs_copy"); }, 1600);
});
$("#share").addEventListener("click", async () => {
  const score = S.answers.filter((a) => a.right).length;
  const text = `${t("share_text", { s: score, n: S.answers.length })} ${location.origin + location.pathname}`;
  track("share");
  try { if (navigator.share) { await navigator.share({ text }); return; } } catch (e) { return; }
  window.open("https://wa.me/?text=" + encodeURIComponent(text), "_blank", "noopener");
});

applyLang();
</script>
</body>
</html>
